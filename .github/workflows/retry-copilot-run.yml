name: Retry Copilot run on transient failure

on:
  workflow_run:
    workflows:
      - Running Copilot cloud agent
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  rerun-copilot:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.run_attempt < 3
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed Copilot jobs
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const attempt = context.payload.workflow_run.run_attempt;

            core.info(`Re-running failed jobs for Copilot run ${runId} (attempt ${attempt}).`);
            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
