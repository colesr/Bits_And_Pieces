<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 500 150">
  <style>
    .bg { fill: #0d1117; }
    .text { 
      font-family: monospace; 
      font-size: 14px; 
      white-space: pre;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    
    /* Starfield Radial Speed Effect */
    .starfield {
      transform-origin: 250px 75px;
      animation: star-zoom 1.8s infinite linear;
    }
    .s1 { animation-delay: 0.0s; }
    .s2 { animation-delay: 0.6s; }
    .s3 { animation-delay: 1.2s; }

    @keyframes star-zoom {
      0% {
        transform: scale(0.05);
        opacity: 0;
      }
      30% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% {
        transform: scale(3.2);
        opacity: 0;
      }
    }

    /* Floating Space Objects (Planets/Comets drifting) */
    .space-object {
      transform-origin: 250px 75px;
      animation: space-drift 6s infinite ease-out;
    }
    .obj-planet { animation-delay: 0s; }
    .obj-comet  { animation-delay: 3s; }

    @keyframes space-drift {
      0% {
        transform: scale(0.1) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 1; }
      85% { opacity: 1; }
      100% {
        transform: scale(3.5) rotate(45deg);
        opacity: 0;
      }
    }

    /* Tunnel Rings */
    .ring {
      transform-origin: 250px 75px;
      animation: zoom 2s infinite linear;
    }
    
    .r1 { animation-delay: 0.0s; }
    .r2 { animation-delay: 0.5s; }
    .r3 { animation-delay: 1.0s; }
    .r4 { animation-delay: 1.5s; }

    @keyframes zoom {
      0% {
        transform: scale(0.1);
        opacity: 0;
      }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% {
        transform: scale(2.8);
        opacity: 0;
      }
    }

    /* Color Animations */
    .c1 { animation: pulse1 3s infinite ease-in-out; }
    .c2 { animation: pulse2 3s infinite ease-in-out; }
    .st { fill: #8b949e; }
    .planet { fill: #f0883e; }
    .comet { fill: #d2a8ff; }

    @keyframes pulse1 {
      0%, 100% { fill: #58a6ff; }
      50% { fill: #bc8cff; }
    }
    @keyframes pulse2 {
      0%, 100% { fill: #7ee787; }
      50% { fill: #ff7b72; }
    }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <!-- Background Radial Star Layers -->
  <g class="starfield s1">
    <text x="180" y="30" class="text st" font-size="10">.</text>
    <text x="320" y="40" class="text st" font-size="12">*</text>
    <text x="130" y="110" class="text st" font-size="8">.</text>
    <text x="370" y="120" class="text st" font-size="10">*</text>
  </g>

  <g class="starfield s2">
    <text x="120" y="20" class="text st" font-size="10">*</text>
    <text x="380" y="30" class="text st" font-size="8">.</text>
    <text x="170" y="130" class="text st" font-size="12">*</text>
    <text x="310" y="125" class="text st" font-size="10">.</text>
  </g>

  <g class="starfield s3">
    <text x="210" y="25" class="text st" font-size="8">.</text>
    <text x="290" y="20" class="text st" font-size="10">*</text>
    <text x="100" y="80" class="text st" font-size="12">*</text>
    <text x="400" y="70" class="text st" font-size="8">.</text>
  </g>

  <!-- Drifting Space Objects -->
  <g class="space-object obj-planet">
    <text x="330" y="45" class="text planet" font-size="11">(o)</text>
  </g>

  <g class="space-object obj-comet">
    <text x="160" y="110" class="text comet" font-size="10">=&gt;*</text>
  </g>

  <!-- Vanishing Point Center -->
  <text x="250" y="75" class="text c1" font-size="10">.</text>

  <!-- Concentric Tunnel Structures -->
  <g class="ring r1">
    <text x="250" y="55" class="text c1">+ + + + +</text>
    <text x="250" y="75" class="text c2">+       +</text>
    <text x="250" y="95" class="text c1">+ + + + +</text>
  </g>

  <g class="ring r2">
    <text x="250" y="45" class="text c2">/ - - - \</text>
    <text x="250" y="75" class="text c1">|       |</text>
    <text x="250" y="105" class="text c2">\ - - - /</text>
  </g>

  <g class="ring r3">
    <text x="250" y="35" class="text c1"># = = = = #</text>
    <text x="250" y="75" class="text c2">|         |</text>
    <text x="250" y="115" class="text c1"># = = = = #</text>
  </g>

  <g class="ring r4">
    <text x="250" y="25" class="text c2">&lt; * * * * * &gt;</text>
    <text x="250" y="75" class="text c1">:           :</text>
    <text x="250" y="125" class="text c2">&lt; * * * * * &gt;</text>
  </g>
</svg>
